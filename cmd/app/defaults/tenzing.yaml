# Starter config. Every provider and model tenzing can use is declared here —
# nothing is compiled into the binary, so this file is required.

# The main agent's model, named by one of the models: entries below. It is
# also the fallback for subagents and the blackboard REPL when those leave
# their own model unset.
model: main-model

# A System One decision model (see models.systemone below). Setting it lets
# that model gate tool calls, judge when the agent should consult its advisor,
# and pick which model serves the turn. Every decision fails open: if the
# endpoint is unreachable the harness behaves exactly as it would without it,
# and the gate can only tighten a permission decision, never loosen one.
systemone_model: jev

# Tunes the consumers above; no effect without systemone_model. Every key is
# optional — omit the block entirely for the defaults shown.
systemone:
  recent_messages: 4     # trailing messages sent with each question; 0 = none
  gate:
    enabled: true
    ask_above: 0.6       # escalate to an approval prompt above this
    deny_above: 0.9      # refuse an out-of-scope call above this
  advisor:
    enabled: true        # needs advisor_model; nothing to consult otherwise
    consult_above: 0.7
  # routing:
  #   enabled: true        # on by itself once two models.llm entries have a description
  #   min_confidence: 0.5

# Set permissions for the agent. The default is Read-only, which is safe for most users.
permissions:
  allow: [Read, Write, Edit, repl]

# Global system prompt, resolved relative to THIS file (~/.config/tenzing/SYSTEM.md).
# Uncomment once SYSTEM.md exists. Note: it REPLACES the built-in prompt entirely.
system_file: SYSTEM_PROMPT.md

# A provider is one backend: a wire protocol (type) plus the endpoint and
# key to reach it. name is a free label — declare the same type twice to
# reach a local box and a hosted endpoint from one config. api_key is
# optional (a local Ollama needs none) and $VAR is expanded from the
# environment, so the secret never lands on disk.
# Types are wire protocols, not vendors: anthropic, ollama, openai_compat
# (the default — every hosted OpenAI-compatible API), systemone (decision
# models; see models.systemone below).
providers:
  - name: ollama-cloud
    type: ollama
    url: https://ollama.com/
    api_key: "$OLLAMA_API_KEY"

  # A System One backend. TypeSafe serves the endpoint directly; OpenRouter
  # mirrors the same route, so either works — only url and model_name change.
  # The url stops before /v1: the client appends /v1/systemone itself, which
  # is why this is NOT the same base as an openai_compat OpenRouter entry
  # (that one ends in /api/v1).
  # - name: openrouter-jev
  #   type: systemone
  #   url: https://openrouter.ai/api
  #   api_key: "$OPENROUTER_API_KEY"

# name is the local alias config and --model refer to; model_name is the id
# sent to the provider on the wire. Tags/sizes below were verified against
# ollama.com/api/show: GLM-5.3 reports 1048576 context; 999424 leaves some
# headroom. Flash reports vision; 5.3 does not. Max tokens is 32768, the
# maximum for 5.3.
#
# models: is split by kind. llm: entries are chat models; systemone: entries
# are decision models — one state plus typed questions in, one calibrated
# typed answer per question out, no generated text. The two kinds share one
# alias namespace, so a name may appear in only one of them. A bare list
# under models: is still read as llm:, so configs written before the split
# keep working.
models:
  llm:
    - name: main-model
      provider: ollama-cloud
      model_name: glm-5.3-flash
      # description: is documentation with one consumer — System One routing.
      # A described model becomes a routing candidate and this text is what
      # the decision model is told the option is for. Routing turns itself on
      # once two entries here carry one.
      description: Frontier model. Anything with a design decision in it.
      context_window: 999424
      max_response_tokens: 32768
      vision: true
      reasoning_effort: high

  # A System One model takes three keys and no more: it returns a fixed-size
  # typed answer (nothing to cap, and output is not billed), takes no images
  # and has no reasoning tier. model_name is "jev-latest" against TypeSafe
  # and "typesafe/jev-1.13" via OpenRouter.
  # systemone:
  #   - name: jev
  #     provider: openrouter-jev
  #     model_name: typesafe/jev-1.13
